<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFA Weapon Pack | Tier list</title>
<style>
@font-face {
    font-family: 'MBender';
    src: url('https://db.onlinewebfonts.com/t/2c45167db073a55a8f7c9e0a058d8c22.woff2') format('woff2');
}

:root {
    --bg-main: #0c0d0c;
    --bg-panel: #141514;
    --border-color: #3b3d36;
    --text-main: #c4c3b6;
    --text-muted: #6e7069;
    --accent: #9a8866;
    --tier-s: #932a2a;
    --tier-a: #65743a;
    --tier-b: #3a5c74;
    --tier-c: #55554f;
    --hover-bg: #1c1d1a;
    --hover-border: #7c8a67;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    color: var(--text-main);
    background-color: var(--bg-main);
    background-image: radial-gradient(circle at 50% 0%, #151615 0%, #080808 100%);
    font-family: 'MBender', 'Trebuchet MS', sans-serif;
    min-height: 100vh;
}

.wrap {
    max-width: 1440px;
    margin: auto;
    padding: 30px 22px 60px;
}

section { margin: 0 0 40px; }

h2 {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0 0 15px;
    font-size: 1.5rem;
    text-transform: uppercase;
    color: var(--accent);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 5px;
    letter-spacing: 1px;
}

h2 small {
    color: var(--text-muted);
    font-size: 0.9rem;
    letter-spacing: 0;
}

.tierboard {
    display: grid;
    grid-template-columns: repeat(4, minmax(150px, 1fr));
    gap: 4px;
    background: #000;
    border: 1px solid var(--border-color);
    padding: 4px;
}

.tier-column {
    min-height: 118px;
    background: var(--bg-panel);
    display: flex;
    flex-direction: column;
}

.tier-column h3 {
    margin: 0;
    padding: 8px;
    text-align: center;
    color: #111;
    font-size: 1.3rem;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.tier-column[data-tier="S"] h3 { background: var(--tier-s); color: #dedede; }
.tier-column[data-tier="A"] h3 { background: var(--tier-a); color: #111; }
.tier-column[data-tier="B"] h3 { background: var(--tier-b); color: #dedede; }
.tier-column[data-tier="C"] h3 { background: var(--tier-c); color: #dedede; }

.tier-items {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px;
}

.weapon {
    position: relative;
    padding: 8px 10px;
    background: #181918;
    border: 1px solid #2a2b29;
    cursor: crosshair;
    transition: all 0.1s ease;
}

.weapon:hover, .weapon:focus {
    z-index: 10;
    border-color: var(--hover-border);
    background: var(--hover-bg);
    outline: none;
}

.weapon-name {
    display: block;
    font-weight: 700;
    font-size: 1.1rem;
    color: #e2e2d9;
    text-transform: uppercase;
}

.weapon-origin {
    display: block;
    margin-top: 3px;
    color: var(--text-muted);
    font-size: 0.8rem;
}

.note {
    color: var(--text-muted);
    font-style: italic;
    font-size: 0.85rem;
    text-align: center;
    display: block;
    padding: 10px;
}

/* Tarkov Tooltip Styles */
.weapon-tooltip {
    position: absolute;
    left: calc(100% + 4px);
    top: 0;
    width: max-content;
    max-width: 280px;
    background: rgba(18, 19, 18, 0.95);
    border: 1px solid #4a4d46;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.8);
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transform: translateX(-8px);
    transition: opacity 0.1s ease, transform 0.1s ease;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(4px);
}

.weapon:nth-child(n+4) .weapon-tooltip {
    left: auto;
    right: calc(100% + 4px);
    transform: translateX(8px);
}

.weapon:hover .weapon-tooltip, .weapon:focus .weapon-tooltip {
    opacity: 1;
    transform: translateX(0);
}

.tooltip-header {
    background: #252724;
    color: #e2e2d9;
    padding: 6px 10px;
    font-size: 1.05rem;
    font-weight: 700;
    border-bottom: 1px solid #4a4d46;
    text-transform: uppercase;
}

.tooltip-tier {
    padding: 4px 10px;
    color: var(--accent);
    font-size: 0.85rem;
    background: #151615;
    border-bottom: 1px solid #2a2b29;
}

.tooltip-stats {
    padding: 8px 10px;
    color: #8c8d88;
    font-size: 0.8rem;
    line-height: 1.5;
}

.tooltip-stats span {
    display: block;
}

.tooltip-stats b {
    color: #b0b1a8;
    font-weight: normal;
}

@media(max-width:900px){
    .tierboard { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
    .weapon-tooltip { display: none; }
}
@media(max-width:600px){
    .tierboard { grid-template-columns: 1fr; }
}
</style>
</head>

const sourceNames={'ПКМ':'PKM','РПК':'RPK','РПК-74':'RPK-74','РПК-74М':'RPK-74M','РПД':'RPD','РГ-6':'RG-6','РПГ-7':'RPG-7'};

function renderBoard(group) {
    const order = ['C', 'B', 'A', 'S'];
    return `<section>
        <h2>${group.name} <small>${group.sub}</small></h2>
        <div class="tierboard">
            ${order.map(tier => {
                const items = group.rows
                    .filter(row => row[2] === tier)
                    .sort((a,b) => a[1].localeCompare(b[1], 'ru'))
                    .map(([origin, name, level, stats]) => {
                        const displayName = sourceNames[name] || name;
                        
                        const statsHtml = stats.split(' · ').map(stat => {
                            let parts = stat.split(' ');
                            let key = parts.shift();
                            return `<span><b>${key}</b> ${parts.join(' ')}</span>`;
                        }).join('');

                        return `
                        <div class="weapon" tabindex="0">
                            <span class="weapon-name">${displayName}</span>
                            <span class="weapon-origin">${origin}</span>
                            <div class="weapon-tooltip">
                                <div class="tooltip-header">${displayName}</div>
                                <div class="tooltip-tier">Класс: ${level}</div>
                                <div class="tooltip-stats">${statsHtml}</div>
                            </div>
                        </div>`;
                    }).join('');
                
                return `
                <div class="tier-column" data-tier="${tier}">
                    <h3>${tier}</h3>
                    <div class="tier-items">
                        ${items || '<span class="note">Нет оружия</span>'}
                    </div>
                </div>`;
            }).join('')}
        </div>
    </section>`;
}

document.getElementById('tables').innerHTML = groups.map(renderBoard).join('');
